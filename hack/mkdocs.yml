site_name: harbor-operator
site_description: Kubernetes operator for managing Harbor through custom resources.
site_url: https://rkthtrifork.github.io/harbor-operator/
docs_dir: ../docs
site_dir: ../site
repo_url: https://github.com/rkthtrifork/harbor-operator
repo_name: rkthtrifork/harbor-operator
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra_javascript:
  - https://unpkg.com/mermaid@11.16.0/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Introduction:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Installation: introduction/installation.md
      - Concepts: introduction/concepts.md
      - FAQ: introduction/faq.md
  - Guides:
      - Connection Patterns: reference/connection-patterns.md
      - Multi-Tenancy: reference/multi-tenancy.md
      - Lifecycle and Ownership: reference/deletion-and-ownership.md
      - Upgrading: guides/upgrading.md
      - Troubleshooting: reference/troubleshooting.md
      - Examples:
          - Overview: examples/index.md
          - Connection and Project: examples/connection-and-project.md
          - Robot Credentials: examples/robot.md
          - Singleton APIs: examples/singletons.md
  - Reference:
      - Overview: reference/index.md
      - Resource Index: reference/resources.md
      - Operator Configuration: reference/operator-configuration.md
      - Common Spec Fields: reference/common-spec-fields.md
      - Status and Conditions: reference/status-and-conditions.md
      - Resource Guides:
          - Overview: crds/index.md
          - Connections:
              - HarborConnection: crds/harbor-connection.md
              - ClusterHarborConnection: crds/cluster-harbor-connection.md
          - Identity and Access:
              - User: crds/user.md
              - UserGroupClaim: crds/usergroup.md
              - Member: crds/member.md
              - Robot: crds/robot.md
          - Projects and Registries:
              - Project: crds/project.md
              - Registry: crds/registry.md
              - ReplicationPolicy: crds/replicationpolicy.md
          - Project Policies:
              - Label: crds/label.md
              - Quota: crds/quota.md
              - ImmutableTagRule: crds/immutabletagrule.md
              - WebhookPolicy: crds/webhookpolicy.md
              - RetentionPolicy: crds/retentionpolicy.md
          - Instance Administration:
              - Configuration: crds/configuration.md
              - ScannerRegistration: crds/scannerregistration.md
              - ScanAllSchedule: crds/scanallschedule.md
              - GCSchedule: crds/gcschedule.md
              - PurgeAuditSchedule: crds/purgeaudit.md
      - Generated API Reference:
          - Full Reference: reference/api.md
  - Architecture:
      - Technical Architecture: technical-architecture.md
      - Architecture Decision Records: decisions/index.md
  - Project:
      - Backlog: backlog.md
      - Technical Debt: tech-debt.md
  - Contributing:
      - Overview: contributing/index.md
      - Local Development: contributing/local-development.md
      - Documentation: contributing/documentation.md
      - Testing and Verification: contributing/testing.md
      - Releases: contributing/releases.md
