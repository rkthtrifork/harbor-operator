---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: usergroupclaims.harbor.harbor-operator.io
spec:
  group: harbor.harbor-operator.io
  names:
    categories:
    - harbor
    kind: UserGroupClaim
    listKind: UserGroupClaimList
    plural: usergroupclaims
    singular: usergroupclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.groupName
      name: Group
      type: string
    - jsonPath: .spec.groupType
      name: Type
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UserGroupClaim is the Schema for the usergroupclaims API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UserGroupClaimSpec describes an external identity that must be registered
              in Harbor. The claim is intentionally non-owning: deleting it never deletes
              the global Harbor UserGroup because that would remove memberships belonging
              to other claims.
            properties:
              driftDetectionInterval:
                description: DriftDetectionInterval is the interval at which the operator
                  checks for drift.
                type: string
              groupName:
                description: |-
                  GroupName is the exact external group name stored in Harbor. For OIDC
                  groups, this is commonly the identity provider's group ID.
                minLength: 1
                type: string
              groupType:
                description: GroupType is the group type (1=LDAP, 2=HTTP, 3=OIDC).
                enum:
                - 1
                - 2
                - 3
                type: integer
              harborConnectionRef:
                description: |-
                  HarborConnectionRef references the Harbor connection object to use.
                  When the operator is started with --harbor-connection, this field may be omitted.
                properties:
                  kind:
                    default: HarborConnection
                    description: |-
                      Kind selects the Harbor connection object kind.
                      Defaults to HarborConnection.
                    enum:
                    - HarborConnection
                    - ClusterHarborConnection
                    type: string
                  name:
                    description: Name of the referenced Harbor connection object.
                    type: string
                required:
                - name
                type: object
              ldapGroupDN:
                description: LDAPGroupDN is the DN of the LDAP group when GroupType
                  is LDAP.
                type: string
              reconcileNonce:
                description: ReconcileNonce forces an immediate reconcile when updated.
                type: string
            required:
            - groupName
            - groupType
            type: object
            x-kubernetes-validations:
            - message: group identity fields are immutable
              rule: '!has(oldSelf.groupName) || (self.groupName == oldSelf.groupName
                && self.groupType == oldSelf.groupType && has(self.ldapGroupDN) ==
                has(oldSelf.ldapGroupDN) && (!has(self.ldapGroupDN) || self.ldapGroupDN
                == oldSelf.ldapGroupDN))'
          status:
            description: UserGroupClaimStatus defines the observed state of UserGroupClaim.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              harborGroupID:
                description: HarborGroupID is the shared global UserGroup ID in Harbor.
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              resolvedHarborConnection:
                description: |-
                  ResolvedHarborConnection is the exact connection identity used for Harbor
                  operations. Once set, changing the effective connection is refused.
                properties:
                  kind:
                    description: Kind is either HarborConnection or ClusterHarborConnection.
                    type: string
                  name:
                    description: Name is the name of the connection object.
                    type: string
                  namespace:
                    description: Namespace is set for a namespaced HarborConnection.
                    type: string
                  uid:
                    description: UID is the Kubernetes UID of the connection object.
                    type: string
                required:
                - kind
                - name
                - uid
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
