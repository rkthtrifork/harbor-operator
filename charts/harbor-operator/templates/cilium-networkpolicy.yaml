{{- if and .Values.networkPolicy.enabled (ne .Values.networkPolicy.type "cilium") (gt (len .Values.networkPolicy.egress.harborFQDNs) 0) -}}
{{- fail "networkPolicy.egress.harborFQDNs requires networkPolicy.type=cilium" -}}
{{- end -}}
{{- if and .Values.networkPolicy.enabled (eq .Values.networkPolicy.type "cilium") -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "harbor-operator.fullname" . }}-network
  labels:
{{ include "harbor-operator.labels" . | indent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "harbor-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if and .Values.metrics.enabled .Values.networkPolicy.ingress.metrics.enabled (gt (len .Values.networkPolicy.ingress.metrics.namespaces) 0) }}
  ingress:
    - fromEndpoints:
{{- range .Values.networkPolicy.ingress.metrics.namespaces }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . | quote }}
{{- end }}
      toPorts:
        - ports:
            - port: {{ .Values.metrics.port | quote }}
              protocol: TCP
  {{- end }}
  egress:
  {{- if and .Values.networkPolicy.egress.allowKubeAPI (gt (len .Values.networkPolicy.egress.kubeAPIPorts) 0) }}
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
{{- range .Values.networkPolicy.egress.kubeAPIPorts }}
            - port: {{ . | quote }}
              protocol: TCP
{{- end }}
  {{- end }}
  {{- if .Values.networkPolicy.egress.dns.enabled }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.egress.dns.namespace | quote }}
{{- range $k, $v := .Values.networkPolicy.egress.dns.podSelector.matchLabels }}
            k8s:{{ $k }}: {{ $v | quote }}
{{- end }}
{{- with .Values.networkPolicy.egress.dns.podSelector.matchExpressions }}
          matchExpressions:
{{- range . }}
            - key: k8s:{{ .key }}
              operator: {{ .operator }}
{{- with .values }}
              values:
{{ toYaml . | nindent 16 }}
{{- end }}
{{- end }}
{{- end }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  {{- end }}
  {{- with .Values.networkPolicy.egress.harborFQDNs }}
    - toFQDNs:
  {{- range . }}
        - matchName: {{ . | quote }}
  {{- end }}
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
  {{- end }}
  {{- range .Values.networkPolicy.egress.harborSelectors }}
    - toEndpoints:
        - matchLabels:
{{- if .namespace }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace | quote }}
{{- else if .namespaceSelector.matchLabels }}
{{- range $k, $v := .namespaceSelector.matchLabels }}
            k8s:io.cilium.k8s.namespace.labels.{{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if .podSelector }}
{{- range $k, $v := .podSelector.matchLabels }}
            k8s:{{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "443"
              protocol: TCP
  {{- end }}
{{- end }}
